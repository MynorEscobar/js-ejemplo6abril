<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
    <script>
        function mostrarMensaje(){
            document.getElementById('mensaje').innerHTML='hola, presionaste el boton';
        }
        function cambiarMensaje(){
            document.getElementById('mensaje').innerHTML="mensaje cambiado";
        }
    </script>
</head>
<body>
    <header>
        <h1>JavaScript: Ejemplo 2</h1>
    </header>
    <nav>

    </nav>
    <main>
        <h2>JavaScript dentro del documento: etiqueta script</h2>
        <button type="button" onclick="mostrarMensaje()">
            Clic aquí
        </button>
        <button type="button" onclick="cambiarMensaje()">
            Clic aquí
        </button>
        <p id="mensaje"> </p>
    </main>
</body>
</html>
